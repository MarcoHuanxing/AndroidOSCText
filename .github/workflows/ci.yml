name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: PC Bridge (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: pc-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test test/osc.test.js test/chatbox.test.js
      - name: Syntax check
        run: |
          for f in src/*.js; do node --check "$f" || exit 1; done

  android:
    name: Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android-app
        run: |
          sed -i 's|sdk.dir=.*|sdk.dir=$ANDROID_SDK_ROOT|' local.properties 2>/dev/null || \
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
